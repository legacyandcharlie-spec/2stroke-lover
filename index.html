<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2T 競技排氣管設計系統 (含 2D 鈑金展開與 CAD/PDF 匯出)</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d30;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #24314d;
            --success: #22c55e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.4rem; color: var(--accent); margin: 0; }
        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label { font-size: 0.85rem; color: var(--text-sub); }
        input, select {
            background: #090d16;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .unit-input { display: flex; align-items: center; gap: 8px; }
        .unit-input input { flex-grow: 1; }
        .unit { font-size: 0.85rem; color: var(--text-sub); width: 40px; }
        
        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--accent-hover); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: #000; }

        /* SVG & Visualization */
        svg {
            width: 100%;
            background: #090d16;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .segment {
            fill: #1e293b;
            stroke: var(--accent);
            stroke-width: 1.5;
            transition: all 0.2s ease;
        }
        .flat-pattern {
            fill: rgba(56, 189, 248, 0.08);
            stroke: var(--accent);
            stroke-width: 1.5;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            margin-top: 10px;
        }
        th, td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-sub); background: rgba(0,0,0,0.2); }

        /* Print Styling for 1:1 Scale Output */
        @media print {
            body { background: white; color: black; padding: 0; }
            .app-container { max-width: 100%; }
            .grid-layout, .btn-group, header, .card:first-child { display: none !important; }
            .card { border: none; background: transparent; padding: 0; }
            svg { background: white; border: none; }
            .flat-pattern { stroke: black; fill: none; stroke-width: 1px; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>2T 專用膨脹管線上設計與 CAD 鈑金展開系統</h1>
    </header>

    <div class="grid-layout">
        <!-- 控制面板 -->
        <div class="card">
            <h3 style="margin-top:0; color:var(--text-main);">引擎參數設定</h3>
            <div class="input-group">
                <div class="input-field">
                    <label>總排氣量 (Displacement)</label>
                    <div class="unit-input">
                        <input type="number" id="ccInput" value="136" min="50" max="1000">
                        <span class="unit">c.c.</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>汽缸數量</label>
                    <select id="cylInput">
                        <option value="1" selected>單缸 (1缸 - 獨立管)</option>
                        <option value="2">雙缸 (2缸)</option>
                    </select>
                </div>

                <div class="input-field">
                    <label>排氣持續角度 (Exhaust Duration)</label>
                    <div class="unit-input">
                        <input type="number" id="durationInput" value="186" min="150" max="210">
                        <span class="unit">度 (°)</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>目標峰值轉速 (Target RPM)</label>
                    <div class="unit-input">
                        <input type="number" id="rpmInput" value="10000" min="4000" max="15000">
                        <span class="unit">RPM</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>排氣溫度 (EGT)</label>
                    <div class="unit-input">
                        <input type="number" id="egtInput" value="600" min="400" max="750">
                        <span class="unit">°C</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 圖形與匯出功能 -->
        <div class="card" style="display:flex; flex-direction:column; gap:15px;">
            <!-- 按鈕組 -->
            <div class="btn-group">
                <button class="btn" onclick="exportDXF()">💾 匯出 CAD 檔 (.DXF)</button>
                <button class="btn btn-outline" onclick="exportSVG()">🎨 匯出向量圖 (.SVG)</button>
                <button class="btn btn-outline" onclick="window.print()">🖨️ 列印 1:1 展開圖 (PDF)</button>
            </div>

            <div class="print-only" style="margin-bottom: 10px; font-weight: bold; border-bottom: 2px solid black; padding-bottom: 5px;">
                1:1 比例 2D 鈑金展開圖 (印表機設定請選擇「實際大小 / 100% 比例」，勿縮放頁面)
            </div>

            <!-- 立體與展開圖 SVG 顯示區 -->
            <div>
                <h4 style="margin:5px 0; color:var(--accent);">1. 3D 立體總成投影圖</h4>
                <svg id="pipeSvg" viewBox="0 0 1000 160"></svg>
            </div>

            <div>
                <h4 style="margin:5px 0; color:var(--accent);">2. 2D 扇形鈑金展開圖 (Flat Pattern)</h4>
                <svg id="flatSvg" viewBox="0 0 1000 380"></svg>
            </div>

            <!-- 數據表格 -->
            <div>
                <h4 style="margin:10px 0 5px 0;">鈑金展開圖尺寸對照表</h4>
                <table>
                    <thead>
                        <tr>
                            <th>區段</th>
                            <th>外弧半徑 (Rout)</th>
                            <th>內弧半徑 (Rin)</th>
                            <th>展開圓心角 (θ)</th>
                            <th>板金斜高 (S)</th>
                        </tr>
                    </thead>
                    <tbody id="flatTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let currentSegments = [];
let flatPatterns = [];

function calculatePipe() {
    const totalCC = parseFloat(document.getElementById('ccInput').value) || 136;
    const cylinders = parseInt(document.getElementById('cylInput').value) || 1;
    const duration = parseFloat(document.getElementById('durationInput').value) || 186;
    const rpm = parseFloat(document.getElementById('rpmInput').value) || 10000;
    const egt = parseFloat(document.getElementById('egtInput').value) || 600;

    const singleCC = totalCC / cylinders;
    const soundSpeed = 20.05 * Math.sqrt(273.15 + egt); 
    const tunedLength = (duration * soundSpeed * 1000) / (12 * rpm);

    const headerD = Math.sqrt(singleCC / 136) * 35.0;
    const bellyD = headerD * 2.75;
    const stingerD = headerD * 0.60;

    const headerL = tunedLength * 0.287;
    const diff1L = tunedLength * 0.191;
    const diff2L = tunedLength * 0.191;
    const bellyL = tunedLength * 0.164;
    const baffleL = tunedLength * 0.219;
    const stingerL = stingerD * 10.5;

    const diff1D2 = headerD + (bellyD - headerD) * 0.40;

    currentSegments = [
        { name: "1. 頭段 (Header)", l: headerL, d1: headerD, d2: headerD * 1.04 },
        { name: "2a. 一級擴散錐", l: diff1L, d1: headerD * 1.04, d2: diff1D2 },
        { name: "2b. 二級擴散錐", l: diff2L, d1: diff1D2, d2: bellyD },
        { name: "3. 中段膨脹室", l: bellyL, d1: bellyD, d2: bellyD },
        { name: "4. 反射錐 (Baffle)", l: baffleL, d1: bellyD, d2: stingerD },
        { name: "5. 尾管 (Stinger)", l: stingerL, d1: stingerD, d2: stingerD }
    ];

    // 計算 2D 鈑金展開幾何 (Frustum Cone Development)
    flatPatterns = currentSegments.map(seg => {
        const r1 = seg.d1 / 2;
        const r2 = seg.d2 / 2;
        const L = seg.l;

        if (Math.abs(r1 - r2) < 0.1) {
            // 平行圓筒 (Cylinder Rectangle)
            const width = Math.PI * seg.d1;
            return { name: seg.name, isCylinder: true, width: width, height: L, Rout: 0, Rin: 0, angle: 0, S: L };
        } else {
            // 截頭圓錐 (Frustum Cone)
            const rMax = Math.max(r1, r2);
            const rMin = Math.min(r1, r2);
            const S = Math.sqrt(L * L + (rMax - rMin) * (rMax - rMin));
            const Rout = (rMax * S) / (rMax - rMin);
            const Rin = Rout - S;
            const theta = 360 * (rMax / Rout);

            return { name: seg.name, isCylinder: false, Rout: Rout, Rin: Rin, angle: theta, S: S };
        }
    });

    renderPipeSVG();
    renderFlatSVG();
    renderTable();
}

function renderPipeSVG() {
    const svg = document.getElementById('pipeSvg');
    svg.innerHTML = '';
    let currentX = 30;
    const centerY = 80;
    const scaleY = 50 / currentSegments[3].d1;
    const totalLength = currentSegments.reduce((sum, s) => sum + s.l, 0);
    const scaleX = 920 / totalLength;

    currentSegments.forEach(seg => {
        const x1 = currentX;
        const x2 = currentX + (seg.l * scaleX);
        const r1 = (seg.d1 / 2) * scaleY;
        const r2 = (seg.d2 / 2) * scaleY;

        const pathData = `M ${x1} ${centerY - r1} L ${x2} ${centerY - r2} L ${x2} ${centerY + r2} L ${x1} ${centerY + r1} Z`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData);
        path.setAttribute("class", "segment");
        svg.appendChild(path);
        currentX = x2;
    });
}

function renderFlatSVG() {
    const svg = document.getElementById('flatSvg');
    svg.innerHTML = '';
    let startX = 30;

    flatPatterns.forEach((pat, i) => {
        if (pat.isCylinder) {
            // 矩形展開
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttribute("x", startX);
            rect.setAttribute("y", 100);
            rect.setAttribute("width", pat.height * 0.8);
            rect.setAttribute("height", pat.width * 0.4);
            rect.setAttribute("class", "flat-pattern");
            svg.appendChild(rect);
            startX += (pat.height * 0.8) + 30;
        } else {
            // 扇形展開繪製
            const cx = startX + pat.Rout * 0.3;
            const cy = 280;
            const rOut = pat.Rout * 0.3;
            const rIn = pat.Rin * 0.3;
            const startAngle = -90 - (pat.angle / 2);
            const endAngle = -90 + (pat.angle / 2);

            const rad1 = (startAngle * Math.PI) / 180;
            const rad2 = (endAngle * Math.PI) / 180;

            const x1 = cx + rOut * Math.cos(rad1);
            const y1 = cy + rOut * Math.sin(rad1);
            const x2 = cx + rOut * Math.cos(rad2);
            const y2 = cy + rOut * Math.sin(rad2);

            const x3 = cx + rIn * Math.cos(rad2);
            const y3 = cy + rIn * Math.sin(rad2);
            const x4 = cx + rIn * Math.cos(rad1);
            const y4 = cy + rIn * Math.sin(rad1);

            const largeArc = pat.angle > 180 ? 1 : 0;

            const pathData = `M ${x1} ${y1} A ${rOut} ${rOut} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${rIn} ${rIn} 0 ${largeArc} 0 ${x4} ${y4} Z`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("class", "flat-pattern");
            svg.appendChild(path);

            startX += (rOut * 2) + 20;
        }
    });
}

function renderTable() {
    const tbody = document.getElementById('flatTableBody');
    tbody.innerHTML = '';
    flatPatterns.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td><b>${p.name}</b></td>
                <td>${p.isCylinder ? '-' : p.Rout.toFixed(1) + ' mm'}</td>
                <td>${p.isCylinder ? '-' : p.Rin.toFixed(1) + ' mm'}</td>
                <td>${p.isCylinder ? '矩形對邊' : p.angle.toFixed(1) + '°'}</td>
                <td>${p.S.toFixed(1)} mm</td>
            </tr>
        `;
    });
}

// 匯出標準 ASCII DXF 向量圖檔 (可直接導入 AutoCad / Laser Cut 雷射切割機)
function exportDXF() {
    let dxf = "0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
    let offsetX = 0;

    flatPatterns.forEach(pat => {
        if (pat.isCylinder) {
            // 繪製矩形 4 條線
            const w = pat.height;
            const h = pat.width;
            dxf += dxfLine(offsetX, 0, offsetX + w, 0);
            dxf += dxfLine(offsetX + w, 0, offsetX + w, h);
            dxf += dxfLine(offsetX + w, h, offsetX, h);
            dxf += dxfLine(offsetX, h, offsetX, 0);
            offsetX += w + 50;
        } else {
            // 繪製 2 Arc + 2 Line 扇形
            const cx = offsetX + pat.Rout;
            const cy = pat.Rout;
            const a1 = 180 - (pat.angle / 2);
            const a2 = 180 + (pat.angle / 2);

            dxf += dxfArc(cx, cy, pat.Rout, a1, a2);
            dxf += dxfArc(cx, cy, pat.Rin, a1, a2);

            const r1 = (a1 * Math.PI) / 180;
            const r2 = (a2 * Math.PI) / 180;
            dxf += dxfLine(cx + pat.Rin * Math.cos(r1), cy + pat.Rin * Math.sin(r1), cx + pat.Rout * Math.cos(r1), cy + pat.Rout * Math.sin(r1));
            dxf += dxfLine(cx + pat.Rin * Math.cos(r2), cy + pat.Rin * Math.sin(r2), cx + pat.Rout * Math.cos(r2), cy + pat.Rout * Math.sin(r2));

            offsetX += (pat.Rout * 2) + 50;
        }
    });

    dxf += "0\nENDSEC\n0\nEOF\n";

    downloadFile(dxf, "expansion_chamber_flat_pattern.dxf", "application/dxf");
}

function dxfLine(x1, y1, x2, y2) {
    return `0\nLINE\n8\n0\n10\n${x1}\n20\n${y1}\n11\n${x2}\n21\n${y2}\n`;
}

function dxfArc(cx, cy, r, sa, ea) {
    return `0\nARC\n8\n0\n10\n${cx}\n20\n${cy}\n40\n${r}\n50\n${sa}\n51\n${ea}\n`;
}

function exportSVG() {
    const svgContent = document.getElementById('flatSvg').outerHTML;
    downloadFile(svgContent, "expansion_chamber_patterns.svg", "image/svg+xml");
}

function downloadFile(content, fileName, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
}

document.querySelectorAll('input, select').forEach(e => e.addEventListener('input', calculatePipe));
calculatePipe();
</script>
</body>
</html>
