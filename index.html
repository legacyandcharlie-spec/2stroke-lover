<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2T 競技排氣管設計系統 (公分 cm 單位 & 修正版鈑金展開)</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d30;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #24314d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 1.3rem; color: var(--accent); margin: 0; }
        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .input-group { display: flex; flex-direction: column; gap: 14px; }
        .input-field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.85rem; color: var(--text-sub); }
        input, select {
            background: #090d16;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        .unit-input { display: flex; align-items: center; gap: 8px; }
        .unit-input input { flex-grow: 1; }
        .unit { font-size: 0.85rem; color: var(--text-sub); width: 35px; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .btn {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .btn:hover { background: var(--accent-hover); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: #000; }

        svg {
            width: 100%;
            background: #090d16;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .segment { fill: #1e293b; stroke: var(--accent); stroke-width: 1.5; }
        .flat-pattern { fill: rgba(56, 189, 248, 0.12); stroke: var(--accent); stroke-width: 1.5; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-sub); background: rgba(0,0,0,0.2); }

        @media print {
            body { background: white; color: black; padding: 0; }
            .grid-layout, .btn-group, header, .card:first-child { display: none !important; }
            .card { border: none; background: transparent; padding: 0; }
            svg { background: white; border: none; }
            .flat-pattern { stroke: black; fill: none; stroke-width: 1px; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>2T 膨脹管設計系統 (cm 公分單位版)</h1>
    </header>

    <div class="grid-layout">
        <!-- 控制面板 -->
        <div class="card">
            <h3 style="margin-top:0; color:var(--text-main); font-size:1rem;">引擎設定參數</h3>
            <div class="input-group">
                <div class="input-field">
                    <label>總排氣量 (Displacement)</label>
                    <div class="unit-input">
                        <input type="number" id="ccInput" value="136" min="50" max="1000">
                        <span class="unit">c.c.</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>汽缸數量</label>
                    <select id="cylInput">
                        <option value="1" selected>單缸 (1 缸)</option>
                        <option value="2">雙缸 (2 缸)</option>
                    </select>
                </div>

                <div class="input-field">
                    <label>排氣持續角度 (Exhaust Duration)</label>
                    <div class="unit-input">
                        <input type="number" id="durationInput" value="186" min="150" max="210">
                        <span class="unit">度 (°)</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>目標峰值轉速 (Target RPM)</label>
                    <div class="unit-input">
                        <input type="number" id="rpmInput" value="10000" min="4000" max="15000" step="100">
                        <span class="unit">RPM</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>排氣溫度 (EGT)</label>
                    <div class="unit-input">
                        <input type="number" id="egtInput" value="600" min="400" max="750">
                        <span class="unit">°C</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 輸出面板 -->
        <div class="card" style="display:flex; flex-direction:column; gap:15px;">
            <div class="btn-group">
                <button class="btn" onclick="exportDXF()">💾 匯出 CAD (.DXF - cm 單位)</button>
                <button class="btn btn-outline" onclick="exportSVG()">🎨 匯出向量圖 (.SVG)</button>
                <button class="btn btn-outline" onclick="window.print()">🖨️ 列印 1:1 展開圖 (PDF)</button>
            </div>

            <div class="print-only" style="font-weight: bold; border-bottom: 2px solid black; padding-bottom: 5px;">
                1:1 比例 2D 鈑金展開圖 (單位: cm，列印時請選擇「實際大小 / 100% 比例」)
            </div>

            <div id="summaryBox" style="font-size:0.88rem; line-height:1.5; background:#090d16; padding:10px; border-radius:6px; border:1px solid var(--border);"></div>

            <div>
                <h4 style="margin:0 0 6px 0; color:var(--accent);">1. 3D 排氣管立體總成投影 (單位: cm)</h4>
                <svg id="pipeSvg" viewBox="0 0 1000 150"></svg>
            </div>

            <div>
                <h4 style="margin:0 0 6px 0; color:var(--accent);">2. 2D 扇形鈑金展開圖 (Flat Pattern - 單位: cm)</h4>
                <svg id="flatSvg" viewBox="0 0 1000 260"></svg>
            </div>

            <div>
                <h4 style="margin:10px 0 5px 0;">2D 鈑金展開幾何數據對照表 (單位: cm)</h4>
                <table>
                    <thead>
                        <tr>
                            <th>區段</th>
                            <th>軸向長度 (L)</th>
                            <th>小端內徑 (D1)</th>
                            <th>大端內徑 (D2)</th>
                            <th>外弧 (Rout)</th>
                            <th>內弧 (Rin)</th>
                            <th>夾角 (&theta;)</th>
                            <th>斜高 (S)</th>
                        </tr>
                    </thead>
                    <tbody id="flatTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let currentSegments = [];
let flatPatterns = [];

function calculatePipe() {
    const totalCC = parseFloat(document.getElementById('ccInput').value) || 136;
    const cylinders = parseInt(document.getElementById('cylInput').value) || 1;
    const duration = parseFloat(document.getElementById('durationInput').value) || 186;
    const rpm = parseFloat(document.getElementById('rpmInput').value) || 10000;
    const egt = parseFloat(document.getElementById('egtInput').value) || 600;

    const singleCC = totalCC / cylinders;
    const soundSpeed = 20.05 * Math.sqrt(273.15 + egt); // m/s
    // 計算諧振長度 LT (換算為 cm)
    const tunedLength = (duration * soundSpeed * 100) / (12 * rpm); // cm

    // 直徑計算 (cm)
    const headerD = Math.sqrt(singleCC / 136) * 3.5;
    const bellyD = headerD * 2.75;
    const stingerD = headerD * 0.60;

    // 長度分配 (cm)
    const headerL = tunedLength * 0.287;
    const diff1L = tunedLength * 0.191;
    const diff2L = tunedLength * 0.191;
    const bellyL = tunedLength * 0.164;
    const baffleL = tunedLength * 0.219;
    const stingerL = stingerD * 10.5;

    const diff1D2 = headerD + (bellyD - headerD) * 0.40;

    currentSegments = [
        { name: "1. 頭段 (Header)", l: headerL, d1: headerD, d2: headerD * 1.04 },
        { name: "2a. 一級擴散錐", l: diff1L, d1: headerD * 1.04, d2: diff1D2 },
        { name: "2b. 二級擴散錐", l: diff2L, d1: diff1D2, d2: bellyD },
        { name: "3. 中段膨脹室", l: bellyL, d1: bellyD, d2: bellyD },
        { name: "4. 反射錐 (Baffle)", l: baffleL, d1: bellyD, d2: stingerD },
        { name: "5. 尾管 (Stinger)", l: stingerL, d1: stingerD, d2: stingerD }
    ];

    // 精確 2D 幾何展開演算 (全數 cm 單位)
    flatPatterns = currentSegments.map(seg => {
        const r1 = seg.d1 / 2;
        const r2 = seg.d2 / 2;
        const L = seg.l;

        if (Math.abs(r1 - r2) < 0.01) {
            // 圓筒 (Cylinder)
            const width = Math.PI * seg.d1;
            return {
                name: seg.name, isCylinder: true,
                l: L, d1: seg.d1, d2: seg.d2,
                width: width, height: L,
                Rout: 0, Rin: 0, angle: 0, S: L,
                // 局部座標邊界
                bbox: { minX: -width / 2, maxX: width / 2, minY: 0, maxY: L }
            };
        } else {
            // 截頭圓錐 (Frustum Cone)
            const rMax = Math.max(r1, r2);
            const rMin = Math.min(r1, r2);
            const S = Math.sqrt(L * L + (rMax - rMin) * (rMax - rMin));
            const Rout = (rMax * S) / (rMax - rMin);
            const Rin = Rout - S;
            const theta = 360 * (rMax / Rout); // 展開圓心角度 (Deg)
            const radHalf = (theta / 2) * (Math.PI / 180);

            // 以扇形底端為原點的相對端點座標
            const x3 = Rout * Math.sin(radHalf);
            const y3 = Rout * Math.cos(radHalf) - Rin;
            const x2 = Rin * Math.sin(radHalf);
            const y2 = Rin * Math.cos(radHalf) - Rin;

            return {
                name: seg.name, isCylinder: false,
                l: L, d1: seg.d1, d2: seg.d2,
                Rout: Rout, Rin: Rin, angle: theta, S: S,
                localPts: { x2, y2, x3, y3 },
                bbox: { minX: -x3, maxX: x3, minY: Math.min(0, y2), maxY: Math.max(S, y3) }
            };
        }
    });

    document.getElementById('summaryBox').innerHTML = `
        • 單缸排氣量: <b>${singleCC.toFixed(1)} c.c.</b> | 聲速: <b>${soundSpeed.toFixed(1)} m/s</b><br>
        • 總諧振長度 (LT): <b>${tunedLength.toFixed(2)} cm</b> (約 ${(tunedLength * 10).toFixed(0)} mm)
    `;

    renderPipeSVG();
    renderFlatSVG();
    renderTable();
}

function renderPipeSVG() {
    const svg = document.getElementById('pipeSvg');
    svg.innerHTML = '';
    let currentX = 30;
    const centerY = 75;
    const scaleY = 45 / currentSegments[3].d1;
    const totalL = currentSegments.reduce((sum, s) => sum + s.l, 0);
    const scaleX = 920 / totalL;

    currentSegments.forEach(seg => {
        const x1 = currentX;
        const x2 = currentX + (seg.l * scaleX);
        const r1 = (seg.d1 / 2) * scaleY;
        const r2 = (seg.d2 / 2) * scaleY;

        const pathData = `M ${x1} ${centerY - r1} L ${x2} ${centerY - r2} L ${x2} ${centerY + r2} L ${x1} ${centerY + r1} Z`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData);
        path.setAttribute("class", "segment");
        
        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = `${seg.name}\n長度 L: ${seg.l.toFixed(2)} cm\n小端 D1: Ø${seg.d1.toFixed(2)} cm\n大端 D2: Ø${seg.d2.toFixed(2)} cm`;
        path.appendChild(title);

        svg.appendChild(path);
        currentX = x2;
    });
}

function renderFlatSVG() {
    const svg = document.getElementById('flatSvg');
    svg.innerHTML = '';

    // 計算 6 個圖形併排的總寬度與最高高度，進行動態比例縮放 (Auto-Scale)
    const gap = 3.0; // cm 區隔間距
    let totalWidthCM = 0;
    let maxHeightCM = 0;

    flatPatterns.forEach(pat => {
        const w = pat.bbox.maxX - pat.bbox.minX;
        const h = pat.bbox.maxY - pat.bbox.minY;
        totalWidthCM += w + gap;
        if (h > maxHeightCM) maxHeightCM = h;
    });

    const scale = Math.min(940 / totalWidthCM, 200 / maxHeightCM);
    let curXCM = 20 / scale;

    flatPatterns.forEach(pat => {
        const wCM = pat.bbox.maxX - pat.bbox.minX;
        const centerXCM = curXCM + (wCM / 2);
        const baseYCM = 220 / scale - pat.bbox.minY;

        let pathData = "";

        if (pat.isCylinder) {
            const hw = pat.width / 2;
            const x1 = (centerXCM - hw) * scale;
            const x2 = (centerXCM + hw) * scale;
            const y1 = baseYCM * scale;
            const y2 = (baseYCM - pat.height) * scale;
            pathData = `M ${x1} ${y1} L ${x2} ${y1} L ${x2} ${y2} L ${x1} ${y2} Z`;
        } else {
            const { x2, y2, x3, y3 } = pat.localPts;
            const cx = centerXCM * scale;
            const cy = (baseYCM + pat.Rin) * scale;
            const rOut = pat.Rout * scale;
            const rIn = pat.Rin * scale;

            const px1 = (centerXCM - x3) * scale;
            const py1 = (baseYCM - y3) * scale;
            const px2 = (centerXCM + x3) * scale;
            const py2 = (baseYCM - y3) * scale;
            const px3 = (centerXCM + x2) * scale;
            const py3 = (baseYCM - y2) * scale;
            const px4 = (centerXCM - x2) * scale;
            const py4 = (baseYCM - y2) * scale;

            const largeArc = pat.angle > 180 ? 1 : 0;

            // M (左上角外弧起點) -> A 外弧至右上角 -> L 至右下角內弧 -> A 內弧至左下角 -> Z
            pathData = `M ${px1} ${py1} A ${rOut} ${rOut} 0 ${largeArc} 1 ${px2} ${py2} L ${px3} ${py3} A ${rIn} ${rIn} 0 ${largeArc} 0 ${px4} ${py4} Z`;
        }

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pathData);
        path.setAttribute("class", "flat-pattern");

        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = `${pat.name}\nRout: ${pat.Rout.toFixed(2)} cm\nRin: ${pat.Rin.toFixed(2)} cm\n夾角: ${pat.angle.toFixed(1)}°`;
        path.appendChild(title);

        svg.appendChild(path);
        curXCM += wCM + gap;
    });
}

function renderTable() {
    const tbody = document.getElementById('flatTableBody');
    tbody.innerHTML = '';
    flatPatterns.forEach(p => {
        tbody.innerHTML += `
            <tr>
                <td><b>${p.name}</b></td>
                <td>${p.l.toFixed(2)} cm</td>
                <td>Ø${p.d1.toFixed(2)} cm</td>
                <td>Ø${p.d2.toFixed(2)} cm</td>
                <td>${p.isCylinder ? '-' : p.Rout.toFixed(2) + ' cm'}</td>
                <td>${p.isCylinder ? '-' : p.Rin.toFixed(2) + ' cm'}</td>
                <td>${p.isCylinder ? '矩形對邊' : p.angle.toFixed(1) + '°'}</td>
                <td>${p.S.toFixed(2)} cm</td>
            </tr>
        `;
    });
}

// 匯出 AutoCAD DXF 檔案 (1:1 精確 cm 單位)
function exportDXF() {
    let dxf = "0\nSECTION\n2\nHEADER\n9\n$INSUNITS\n70\n5\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
    let curX = 0;
    const gap = 5.0; // 圖件間隔 5cm

    flatPatterns.forEach(pat => {
        if (pat.isCylinder) {
            const w = pat.height;
            const h = pat.width;
            dxf += dxfLine(curX, 0, curX + w, 0);
            dxf += dxfLine(curX + w, 0, curX + w, h);
            dxf += dxfLine(curX + w, h, curX, h);
            dxf += dxfLine(curX, h, curX, 0);
            curX += w + gap;
        } else {
            const w = pat.bbox.maxX - pat.bbox.minX;
            const centerX = curX + (w / 2);
            const cy = -pat.Rin;

            const radHalf = (pat.angle / 2) * (Math.PI / 180);
            const a1 = 90 - (pat.angle / 2);
            const a2 = 90 + (pat.angle / 2);

            // 繪製內外弧 (ARC)
            dxf += dxfArc(centerX, cy, pat.Rout, a1, a2);
            dxf += dxfArc(centerX, cy, pat.Rin, a1, a2);

            // 繪製兩側斜邊 (LINE)
            const { x2, y2, x3, y3 } = pat.localPts;
            dxf += dxfLine(centerX - x2, y2, centerX - x3, y3);
            dxf += dxfLine(centerX + x2, y2, centerX + x3, y3);

            curX += w + gap;
        }
    });

    dxf += "0\nENDSEC\n0\nEOF\n";
    downloadFile(dxf, "expansion_chamber_flat_pattern_cm.dxf", "application/dxf");
}

function dxfLine(x1, y1, x2, y2) {
    return `0\nLINE\n8\n0\n10\n${x1.toFixed(4)}\n20\n${y1.toFixed(4)}\n11\n${x2.toFixed(4)}\n21\n${y2.toFixed(4)}\n`;
}

function dxfArc(cx, cy, r, sa, ea) {
    return `0\nARC\n8\n0\n10\n${cx.toFixed(4)}\n20\n${cy.toFixed(4)}\n40\n${r.toFixed(4)}\n50\n${sa.toFixed(4)}\n51\n${ea.toFixed(4)}\n`;
}

function exportSVG() {
    const svgContent = document.getElementById('flatSvg').outerHTML;
    downloadFile(svgContent, "expansion_chamber_patterns_cm.svg", "image/svg+xml");
}

function downloadFile(content, fileName, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
}

document.querySelectorAll('input, select').forEach(e => e.addEventListener('input', calculatePipe));
calculatePipe();
</script>
</body>
</html>
