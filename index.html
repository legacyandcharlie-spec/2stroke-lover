<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2T 競技排氣管設計與 1:1 展開圖系統</title>
    <!-- 引入 Three.js, OrbitControls, Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #151d30;
            --panel-card: #090d16;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #24314d;
            --input-bg: #090d16;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-card: #f1f5f9;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0; padding: 12px;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px var(--shadow);
        }
        h1 { font-size: 1.15rem; color: var(--accent); margin: 0; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .grid-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 16px;
        }
        @media (max-width: 980px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px var(--shadow);
        }

        .section-title {
            margin: 0 0 10px 0;
            font-size: 0.92rem;
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .input-field { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: var(--text-sub); }

        .slider-row { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { flex-grow: 1; accent-color: var(--accent); height: 20px; }
        .num-input { width: 75px; text-align: right; }

        input, select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.88rem;
            min-height: 38px;
            outline: none;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 38px;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }
        .btn-outline:hover { background: var(--accent); color: #fff; }

        .container-3d-wrapper {
            position: relative;
            background: var(--panel-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            height: 420px;
            overflow: hidden;
        }
        #container3D { width: 100%; height: 100%; }

        .toolbar-3d {
            position: absolute;
            top: 8px; right: 8px;
            display: flex; gap: 6px; z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px; border-radius: 6px; backdrop-filter: blur(4px);
        }

        .chart-container {
            position: relative;
            background: var(--panel-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            height: 240px;
        }

        .tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .tab-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 8px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-sub); background: rgba(0,0,0,0.1); }

        .svg-container {
            background: var(--panel-card);
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 16px;
            overflow-x: auto;
        }

        .unfold-item {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }
        .unfold-item-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
        }

        /* 1:1 列印專用樣式 */
        .print-only { display: none; }
        @media print {
            body { background: #fff !important; color: #000 !important; padding: 0 !important; }
            .no-print, header, .header-actions, .grid-layout > .card:first-child, .tab-bar, .toolbar-3d, #tab3D, #tabSim { display: none !important; }
            .grid-layout { display: block !important; }
            .card { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
            .tab-content { display: block !important; }
            .print-only { display: block !important; }
            .svg-container { background: #fff !important; border: none !important; padding: 0 !important; }
            .unfold-item { page-break-inside: avoid; border-bottom: 1px solid #000 !important; margin-bottom: 20mm; }
            svg { stroke: #000 !important; fill: none !important; }
            path { fill: none !important; stroke: #000 !important; stroke-width: 1px !important; }
            text { fill: #000 !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="no-print">
        <h1>2T 競技排氣管設計與氣波模擬系統</h1>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="toggleTheme()" id="themeBtn">🌙 深色模式</button>
            <button class="btn btn-outline" onclick="triggerPrint()">🖨️ 1:1 列印展開圖</button>
            <button class="btn" onclick="exportDXF()">💾 匯出 CAD (.DXF)</button>
        </div>
    </header>

    <div class="grid-layout">
        <!-- 左側控制面板 -->
        <div class="card no-print">
            <div class="section-title">引擎與氣波參數</div>
            <div class="input-group">
                <div class="input-field">
                    <label>單缸排氣量 (Displacement)</label>
                    <div class="slider-row">
                        <input type="range" id="ccSlider" min="50" max="500" value="136" oninput="syncVal('cc', this.value)">
                        <input type="number" id="ccInput" class="num-input" value="136" onchange="syncVal('cc', this.value)">
                        <span style="font-size:0.8rem;">cc</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>排氣角 (Exhaust Duration)</label>
                    <div class="slider-row">
                        <input type="range" id="durSlider" min="150" max="210" value="186" oninput="syncVal('dur', this.value)">
                        <input type="number" id="durInput" class="num-input" value="186" onchange="syncVal('dur', this.value)">
                        <span style="font-size:0.8rem;">°</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>目標峰值轉速 (Target RPM)</label>
                    <div class="slider-row">
                        <input type="range" id="rpmSlider" min="5000" max="15000" step="100" value="10000" oninput="syncVal('rpm', this.value)">
                        <input type="number" id="rpmInput" class="num-input" value="10000" onchange="syncVal('rpm', this.value)">
                    </div>
                </div>

                <div class="input-field">
                    <label>排氣溫度 EGT (°C)</label>
                    <div class="slider-row">
                        <input type="range" id="egtSlider" min="400" max="750" value="620" oninput="syncVal('egt', this.value)">
                        <input type="number" id="egtInput" class="num-input" value="620" onchange="syncVal('egt', this.value)">
                    </div>
                </div>
            </div>

            <div class="section-title">頭段 3D 蝦殼彎曲姿態</div>
            <div class="input-group">
                <div class="input-field">
                    <label>頭段彎曲總角度 (Bend Angle)</label>
                    <div class="slider-row">
                        <input type="range" id="bendSlider" min="0" max="90" step="5" value="60" oninput="syncVal('bend', this.value)">
                        <input type="number" id="bendInput" class="num-input" value="60" onchange="syncVal('bend', this.value)">
                        <span style="font-size:0.8rem;">°</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>蝦殼彎曲半徑 R (Radius)</label>
                    <div class="slider-row">
                        <input type="range" id="radSlider" min="80" max="300" step="10" value="140" oninput="syncVal('rad', this.value)">
                        <input type="number" id="radInput" class="num-input" value="140" onchange="syncVal('rad', this.value)">
                        <span style="font-size:0.8rem;">mm</span>
                    </div>
                </div>

                <div class="input-field">
                    <label>蝦殼分節數 (Pie Cuts)</label>
                    <input type="number" id="cutsInput" value="5" min="1" max="12" onchange="recalc()">
                </div>
            </div>

            <div class="section-title">尾段消音器 (Silencer)</div>
            <div class="input-group">
                <div class="input-field">
                    <label>消音器長度 (Length)</label>
                    <div class="slider-row">
                        <input type="range" id="silLSlider" min="100" max="400" value="220" oninput="syncVal('silL', this.value)">
                        <input type="number" id="silLInput" class="num-input" value="220" onchange="syncVal('silL', this.value)">
                        <span style="font-size:0.8rem;">mm</span>
                    </div>
                </div>
                <div class="input-field">
                    <label>消音內網口徑 (Core ID)</label>
                    <input type="number" id="silDInput" value="22" min="14" max="35" onchange="recalc()">
                </div>
            </div>
        </div>

        <!-- 右側展示面板 -->
        <div class="card">
            <div id="summaryBox" class="no-print" style="font-size:0.85rem; line-height:1.5; background:var(--panel-card); padding:10px; border-radius:6px; border:1px solid var(--border); margin-bottom:12px;"></div>

            <div class="tab-bar no-print">
                <button class="tab-btn active" onclick="switchTab('tab3D')">3D 姿態與蝦殼</button>
                <button class="tab-btn" onclick="switchTab('tabSim')">馬力波形與氣波模擬</button>
                <button class="tab-btn" onclick="switchTab('tabFlat')">2D 1:1 展開圖與數據</button>
            </div>

            <!-- Tab 1: 3D 視圖 -->
            <div id="tab3D" class="tab-content active">
                <div class="container-3d-wrapper">
                    <div class="toolbar-3d">
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="toggleAutoRotate()">🔄 旋轉</button>
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="toggleWireframe()">📐 線框</button>
                        <button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="resetCamera()">🎯 置中</button>
                    </div>
                    <div id="container3D"></div>
                </div>
            </div>

            <!-- Tab 2: 模擬圖表 -->
            <div id="tabSim" class="tab-content">
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <div>
                        <div style="font-size:0.85rem; font-weight:bold; margin-bottom:4px; color:var(--accent);">預估馬力與扭力輸出曲線 (HP & Torque vs RPM)</div>
                        <div class="chart-container"><canvas id="hpChart"></canvas></div>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:bold; margin-bottom:4px; color:var(--accent);">排氣門端壓力波形脈衝 (Exhaust Pressure Wave Pulse - kPa)</div>
                        <div class="chart-container"><canvas id="waveChart"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Tab 3: 2D 1:1 展開圖與數據表格 -->
            <div id="tabFlat" class="tab-content">
                <div class="print-only" style="margin-bottom:15px; border-bottom:2px solid #000; padding-bottom:10px;">
                    <h2>2T 競技排氣管 1:1 圖紙展開圖 (請以 100% 比例列印)</h2>
                    <p id="printHeaderInfo" style="font-size:12px;"></p>
                </div>

                <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:0.82rem; color:var(--text-sub);">💡 展開圖已精確計算切角正弦波形與圓錐扇形，可直接列印進行打樣金屬裁切。</span>
                    <button class="btn btn-outline" onclick="triggerPrint()">🖨️ 列印 1:1 展開圖</button>
                </div>

                <div class="svg-container" id="svgContainer"></div>

                <div class="no-print" style="overflow-x:auto; margin-top:16px;">
                    <table>
                        <thead>
                            <tr>
                                <th>區段</th>
                                <th>中心長 L</th>
                                <th>入口 ØD1</th>
                                <th>出口 ØD2</th>
                                <th>兩端切角 &beta;1/&beta;2</th>
                                <th>周長 / 扇形角度</th>
                            </tr>
                        </thead>
                        <tbody id="flatTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let scene3D, camera3D, renderer3D, controls3D, pipeGroup3D;
let isAutoRotate = true, isWireframe = false;
let hpChartInst = null, waveChartInst = null;
let currentSegments = [];

function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('themeBtn').innerText = next === 'dark' ? '🌙 深色模式' : '☀️ 淺色模式';
    if(hpChartInst) updateChartColors();
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
    if(tabId === 'tabSim') {
        setTimeout(() => { hpChartInst?.resize(); waveChartInst?.resize(); }, 50);
    }
}

function syncVal(key, val) {
    document.getElementById(key + 'Slider').value = val;
    document.getElementById(key + 'Input').value = val;
    recalc();
}

function triggerPrint() {
    switchTab('tabFlat');
    setTimeout(() => { window.print(); }, 200);
}

function init3D() {
    const container = document.getElementById('container3D');
    scene3D = new THREE.Scene();
    scene3D.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--panel-card').trim());

    camera3D = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 1, 5000);
    camera3D.position.set(200, 250, 450);

    renderer3D = new THREE.WebGLRenderer({ antialias: true });
    renderer3D.setSize(container.clientWidth, container.clientHeight);
    renderer3D.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer3D.domElement);

    controls3D = new THREE.OrbitControls(camera3D, renderer3D.domElement);
    controls3D.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene3D.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(200, 400, 300);
    scene3D.add(dirLight);

    pipeGroup3D = new THREE.Group();
    scene3D.add(pipeGroup3D);

    animate3D();
}

function animate3D() {
    requestAnimationFrame(animate3D);
    if(controls3D) controls3D.update();
    if(isAutoRotate && pipeGroup3D) pipeGroup3D.rotation.y += 0.005;
    if(renderer3D && scene3D && camera3D) renderer3D.render(scene3D, camera3D);
}

function toggleAutoRotate() { isAutoRotate = !isAutoRotate; }
function toggleWireframe() { isWireframe = !isWireframe; render3DPipe(); }
function resetCamera() { if(pipeGroup3D) pipeGroup3D.rotation.set(0,0,0); }

// 主幾何與波形演算
function recalc() {
    const cc = parseFloat(document.getElementById('ccInput').value);
    const dur = parseFloat(document.getElementById('durInput').value);
    const rpm = parseFloat(document.getElementById('rpmInput').value);
    const egt = parseFloat(document.getElementById('egtInput').value);
    const bendAngle = parseFloat(document.getElementById('bendInput').value);
    const bendRadius = parseFloat(document.getElementById('radInput').value);
    const bendCuts = parseInt(document.getElementById('cutsInput').value);
    const silL = parseFloat(document.getElementById('silLInput').value);
    const silD = parseFloat(document.getElementById('silDInput').value);

    const soundSpeed = 20.05 * Math.sqrt(273.15 + egt);
    const tunedLength = (dur * soundSpeed * 1000) / (12 * rpm);

    const headerD = Math.sqrt(cc / 136) * 35;
    const bellyD = headerD * 2.7;
    const stingerD = headerD * 0.6;

    const totalHeaderL = tunedLength * 0.28;
    const diffL = tunedLength * 0.38;
    const bellyL = tunedLength * 0.16;
    const baffleL = tunedLength * 0.18;

    currentSegments = [];

    // 正確的蝦殼切角演算 (Miter angle = BendAngle / (2 * Cuts))
    if (bendAngle > 0 && bendCuts > 0) {
        const miterAngleDeg = bendAngle / (2 * bendCuts);
        const subL = (2 * bendRadius * Math.tan((bendAngle * Math.PI / 180) / (2 * bendCuts)));

        for (let i = 0; i < bendCuts; i++) {
            const d1 = headerD + (headerD * 0.08 - headerD) * (i / bendCuts);
            const d2 = headerD + (headerD * 0.08 - headerD) * ((i + 1) / bendCuts);
            currentSegments.push({
                name: `1-${i+1}. 蝦殼彎節 ${i+1}/${bendCuts}`,
                l: subL, d1: d1, d2: d2,
                beta1: miterAngleDeg,
                beta2: miterAngleDeg,
                turnAngle: bendAngle / bendCuts,
                isBend: true
            });
        }
    } else {
        currentSegments.push({ name: "1. 直線頭段", l: totalHeaderL, d1: headerD, d2: headerD*1.08, beta1:0, beta2:0, turnAngle:0 });
    }

    currentSegments.push(
        { name: "2. 擴散錐 (Diffuser)", l: diffL, d1: headerD*1.08, d2: bellyD, beta1:0, beta2:0, turnAngle:0 },
        { name: "3. 膨脹室 (Belly)", l: bellyL, d1: bellyD, d2: bellyD, beta1:0, beta2:0, turnAngle:0 },
        { name: "4. 反射錐 (Baffle)", l: baffleL, d1: bellyD, d2: stingerD, beta1:0, beta2:0, turnAngle:0 },
        { name: "5. 尾管 (Stinger)", l: stingerD*10, d1: stingerD, d2: stingerD, beta1:0, beta2:0, turnAngle:0 },
        { name: "6. 消音器 (Silencer)", l: silL, d1: silD, d2: silD, beta1:0, beta2:0, turnAngle:0, isSilencer: true }
    );

    const backpressure = (0.00002 * Math.pow(rpm, 1.3) * (silL / Math.pow(silD, 2))).toFixed(2);

    document.getElementById('summaryBox').innerHTML = `
        • 廢氣聲速: <b>${soundSpeed.toFixed(1)} m/s</b> | 總諧振氣波長: <b>${tunedLength.toFixed(1)} mm</b><br>
        • 消音器流阻背壓: <b>${backpressure} kPa</b> | 膨脹管比值: <b>${(bellyD/headerD).toFixed(2)}x</b>
    `;

    document.getElementById('printHeaderInfo').innerText = `排氣量: ${cc}cc | 目標轉速: ${rpm}RPM | 諧振長: ${tunedLength.toFixed(1)}mm | 日期: ${new Date().toLocaleDateString()}`;

    render3DPipe();
    renderUnfoldSVGs();
    renderTable();
    updateCharts(rpm, tunedLength, soundSpeed);
}

function render3DPipe() {
    if(!pipeGroup3D) return;
    while(pipeGroup3D.children.length > 0) {
        const obj = pipeGroup3D.children[0];
        if(obj.geometry) obj.geometry.dispose();
        pipeGroup3D.remove(obj);
    }

    const titaniumColors = [0x38bdf8, 0x8b5cf6, 0xec4899, 0xf59e0b, 0x10b981, 0x0284c7];
    let pos = new THREE.Vector3(0,0,0);
    let dir = new THREE.Vector3(1,0,0);

    currentSegments.forEach((seg, idx) => {
        const r1 = seg.d1 / 2, r2 = seg.d2 / 2;
        const geom = new THREE.CylinderGeometry(r2, r1, seg.l, 32);
        geom.translate(0, seg.l/2, 0);

        const mat = new THREE.MeshStandardMaterial({
            color: isWireframe ? 0x38bdf8 : (seg.isSilencer ? 0x94a3b8 : titaniumColors[idx % titaniumColors.length]),
            metalness: 0.8, roughness: 0.2, wireframe: isWireframe
        });

        const mesh = new THREE.Mesh(geom, mat);
        const segGroup = new THREE.Group();
        segGroup.position.copy(pos);

        const q = new THREE.Quaternion();
        q.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
        segGroup.quaternion.copy(q);
        segGroup.add(mesh);
        pipeGroup3D.add(segGroup);

        pos.add(dir.clone().multiplyScalar(seg.l));

        if (seg.turnAngle) {
            const turnRad = (seg.turnAngle * Math.PI / 180);
            const axis = new THREE.Vector3(0, 0, 1);
            dir.applyAxisAngle(axis, turnRad);
        }
    });

    const bbox = new THREE.Box3().setFromObject(pipeGroup3D);
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    pipeGroup3D.position.sub(center);
}

// 精確 2D 蝦殼正弦曲線與圓錐展開演算法
function renderUnfoldSVGs() {
    const container = document.getElementById('svgContainer');
    container.innerHTML = '';

    currentSegments.forEach((seg, idx) => {
        const div = document.createElement('div');
        div.className = 'unfold-item';

        let svgHtml = '';
        const strokeColor = 'var(--accent)';

        // 1. 蝦殼彎節 (Mitered Cut Segment)
        if (seg.beta1 > 0 || seg.beta2 > 0) {
            const dAvg = (seg.d1 + seg.d2) / 2;
            const C = Math.PI * dAvg;
            const L = seg.l;
            const b1 = seg.beta1 * Math.PI / 180;
            const b2 = seg.beta2 * Math.PI / 180;
            const Npts = 48;

            let topPts = [], botPts = [];
            for (let i = 0; i <= Npts; i++) {
                const u = (i / Npts) * C;
                const theta = (i / Npts) * 2 * Math.PI;
                const yBot = (seg.d1 / 2) * Math.tan(b1) * (1 - Math.cos(theta));
                const yTop = L + (seg.d1 / 2) * Math.tan(b1) + (seg.d2 / 2) * Math.tan(b2) * Math.cos(theta);
                botPts.push(`${u.toFixed(2)},${yBot.toFixed(2)}`);
                topPts.unshift(`${u.toFixed(2)},${yTop.toFixed(2)}`);
            }

            const pathD = `M ${botPts.join(' L ')} L ${topPts.join(' L ')} Z`;
            const maxH = L + seg.d1 * Math.tan(b1) + seg.d2 * Math.tan(b2);

            svgHtml = `
                <div class="unfold-item-title">${seg.name} (周長: ${C.toFixed(1)}mm | 高: ${L.toFixed(1)}mm)</div>
                <svg width="${C + 40}mm" height="${maxH + 30}mm" viewBox="-20 -15 ${C + 40} ${maxH + 30}">
                    <!-- 100mm 比例尺 -->
                    <line x1="0" y1="-8" x2="100" y2="-8" stroke="${strokeColor}" stroke-width="2"/>
                    <text x="0" y="-12" fill="var(--text-main)" font-size="10">100mm 1:1 列印校正尺</text>
                    <path d="${pathD}" stroke="${strokeColor}" stroke-width="1.5" fill="rgba(56, 189, 248, 0.1)"/>
                    <text x="5" y="${L/2}" fill="var(--text-sub)" font-size="10">展開周長 ${C.toFixed(1)}mm</text>
                </svg>
            `;
        }
        // 2. 圓錐台展開 (擴散錐 / 反射錐)
        else if (Math.abs(seg.d1 - seg.d2) > 0.5) {
            const r1 = seg.d1 / 2, r2 = seg.d2 / 2;
            const rMax = Math.max(r1, r2), rMin = Math.min(r1, r2);
            const L = seg.l;
            const S = Math.sqrt(L * L + Math.pow(rMax - rMin, 2));
            const Rout = (rMax * S) / (rMax - rMin);
            const Rin = Rout - S;
            const phiDeg = 360 * (rMax / Rout);
            const phiRad = phiDeg * Math.PI / 180;

            const aStart = -phiRad / 2, aEnd = phiRad / 2;
            const x1 = Rout * Math.sin(aStart), y1 = -Rout * Math.cos(aStart);
            const x2 = Rout * Math.sin(aEnd),   y2 = -Rout * Math.cos(aEnd);
            const x3 = Rin * Math.sin(aEnd),    y3 = -Rin * Math.cos(aEnd);
            const x4 = Rin * Math.sin(aStart),  y4 = -Rin * Math.cos(aStart);

            const largeArc = phiDeg > 180 ? 1 : 0;
            const pathD = `M ${x1},${y1} A ${Rout} ${Rout} 0 ${largeArc} 1 ${x2},${y2} L ${x3},${y3} A ${Rin} ${Rin} 0 ${largeArc} 0 ${x4},${y4} Z`;

            const minX = -Rout * Math.sin(phiRad / 2) - 10;
            const maxX = Rout * Math.sin(phiRad / 2) + 10;
            const minY = -Rout - 20;
            const maxY = -Rin * Math.cos(phiRad / 2) + 10;
            const viewW = maxX - minX;
            const viewH = maxY - minY;

            svgHtml = `
                <div class="unfold-item-title">${seg.name} (圓錐張角: ${phiDeg.toFixed(1)}° | Rout: ${Rout.toFixed(1)}mm)</div>
                <svg width="${viewW}mm" height="${viewH}mm" viewBox="${minX} ${minY} ${viewW} ${viewH}">
                    <line x1="${minX+10}" y1="${minY+10}" x2="${minX+110}" y2="${minY+10}" stroke="${strokeColor}" stroke-width="2"/>
                    <text x="${minX+10}" y="${minY+5}" fill="var(--text-main)" font-size="10">100mm 1:1 校正尺</text>
                    <path d="${pathD}" stroke="${strokeColor}" stroke-width="1.5" fill="rgba(56, 189, 248, 0.1)"/>
                </svg>
            `;
        }
        // 3. 直筒圓柱 (膨脹室 / 尾管 / 消音器)
        else {
            const C = Math.PI * seg.d1;
            const L = seg.l;
            svgHtml = `
                <div class="unfold-item-title">${seg.name} (直筒矩形: ${C.toFixed(1)}mm x ${L.toFixed(1)}mm)</div>
                <svg width="${C + 30}mm" height="${L + 30}mm" viewBox="-10 -15 ${C + 30} ${L + 30}">
                    <line x1="0" y1="-8" x2="100" y2="-8" stroke="${strokeColor}" stroke-width="2"/>
                    <text x="0" y="-12" fill="var(--text-main)" font-size="10">100mm 1:1 校正尺</text>
                    <rect x="0" y="0" width="${C}" height="${L}" stroke="${strokeColor}" stroke-width="1.5" fill="rgba(56, 189, 248, 0.1)"/>
                </svg>
            `;
        }

        div.innerHTML = svgHtml;
        container.appendChild(div);
    });
}

function renderTable() {
    const tbody = document.getElementById('flatTableBody');
    tbody.innerHTML = currentSegments.map(s => {
        const dAvg = (s.d1 + s.d2) / 2;
        const C = (Math.PI * dAvg).toFixed(1);
        return `
            <tr>
                <td><b>${s.name}</b></td>
                <td>${s.l.toFixed(1)} mm</td>
                <td>Ø${s.d1.toFixed(1)}</td>
                <td>Ø${s.d2.toFixed(1)}</td>
                <td>${s.beta1.toFixed(1)}° / ${s.beta2.toFixed(1)}°</td>
                <td>${C} mm</td>
            </tr>
        `;
    }).join('');
}

function initCharts() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const textColor = isDark ? '#94a3b8' : '#64748b';

    const ctx1 = document.getElementById('hpChart').getContext('2d');
    hpChartInst = new Chart(ctx1, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: '馬力 (HP)', data: [], borderColor: '#38bdf8', tension: 0.4 },
            { label: '扭力 (Nm)', data: [], borderColor: '#f59e0b', tension: 0.4 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } } }
    });

    const ctx2 = document.getElementById('waveChart').getContext('2d');
    waveChartInst = new Chart(ctx2, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: '排氣波脈衝 (kPa)', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.2 }
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } } }
    });
}

function updateChartColors() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const textColor = isDark ? '#94a3b8' : '#64748b';
    [hpChartInst, waveChartInst].forEach(c => {
        if(c) {
            c.options.plugins.legend.labels.color = textColor;
            c.update();
        }
    });
}

function updateCharts(targetRpm, tunedL, a) {
    if(!hpChartInst) return;

    const rpms = [], hps = [], torques = [];
    for(let r = 4000; r <= 14000; r += 500) {
        rpms.push(r);
        const ratio = r / targetRpm;
        const efficiency = Math.exp(-Math.pow((ratio - 1) / 0.18, 2));
        const hp = (r / 500) * efficiency * 1.2;
        const tq = (hp * 716.2) / r * 9.8;
        hps.push(hp.toFixed(1));
        torques.push(tq.toFixed(1));
    }
    hpChartInst.data.labels = rpms;
    hpChartInst.data.datasets[0].data = hps;
    hpChartInst.data.datasets[1].data = torques;
    hpChartInst.update();

    const degs = [], waves = [];
    for(let d = 0; d <= 200; d += 5) {
        degs.push(`${d}°`);
        let p = 0;
        if(d > 20 && d < 70) p = -Math.sin((d-20)/50 * Math.PI) * 15;
        if(d > 100 && d < 160) p = Math.sin((d-100)/60 * Math.PI) * 22;
        waves.push(p.toFixed(1));
    }
    waveChartInst.data.labels = degs;
    waveChartInst.data.datasets[0].data = waves;
    waveChartInst.update();
}

function exportDXF() {
    let dxf = "0\nSECTION\n2\nENTITIES\n";
    let x = 0;
    currentSegments.forEach(p => {
        dxf += `0\nLINE\n8\n0\n10\n${x}\n20\n0\n11\n${x + p.l}\n21\n0\n`;
        x += p.l + 20;
    });
    dxf += "0\nENDSEC\n0\nEOF\n";
    const blob = new Blob([dxf], { type: 'application/dxf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '2T_Pipe_Pattern.dxf';
    a.click();
}

window.addEventListener('DOMContentLoaded', () => {
    init3D();
    initCharts();
    recalc();
});
