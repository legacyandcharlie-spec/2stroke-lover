<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2T Racing Exhaust Pipe Master - 二行程排氣管設計與 3D/CFD 模擬系統</title>

  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Three.js OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      --bg-dark: #121418;
      --panel-bg: #1e222b;
      --accent-cyan: #00e5ff;
      --accent-yellow: #ffaa00;
      --accent-orange: #ff5722;
      --border-color: #2c3240;
    }

    body {
      background-color: var(--bg-dark);
      color: #e0e6ed;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .navbar {
      background-color: #181c24;
      border-bottom: 1px solid var(--border-color);
    }

    .panel-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .form-control, .form-select {
      background-color: #121418;
      border: 1px solid var(--border-color);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .form-control:focus, .form-select:focus {
      background-color: #0d0f12;
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }

    label {
      font-size: 0.85rem;
      color: #9ab0c7;
      margin-bottom: 2px;
    }

    .nav-tabs .nav-link {
      color: #8a99ad;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 18px;
      font-weight: 600;
    }

    .nav-tabs .nav-link.active {
      color: var(--accent-cyan);
      background: transparent;
      border-bottom: 2px solid var(--accent-cyan);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 600px;
      background-color: #0a0c0e;
      border-radius: 6px;
      overflow: hidden;
    }

    .3d-hint-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(18, 20, 24, 0.85);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      pointer-events: none;
      z-index: 10;
    }

    .table-dark-custom {
      --bs-table-bg: transparent;
      --bs-table-color: #e0e6ed;
      font-size: 0.85rem;
    }

    .table-dark-custom input {
      padding: 2px 6px;
      font-size: 0.85rem;
      text-align: center;
    }

    .node-row-active {
      background-color: rgba(0, 229, 255, 0.15) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #121418;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c3240;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- 頂部導航列 -->
  <nav class="navbar navbar-expand-lg navbar-dark px-3 mb-3">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="fa-solid fa-fire-burner text-warning me-2 fs-4"></i>
      <span class="fw-bold tracking-wide">2T RACING EXHAUST MASTER</span>

        <!-- 膨脹室與尾管幾何設定 -->

            <li class="nav-item">

          <div class="tab-content" id="mainTabContent">
            
            <!-- Tab 1: 3D Viewport -->

                  <b>3D 操作說明：</b> 滑鼠左鍵旋轉 / 右鍵平移 / 滾輪縮放。<br>

                  <span class="text-info">● 點擊青色球體：</span> 選取該節點並高亮左側參數表。
                </div>

            <!-- Tab 2: 2D Unfolding -->

            <!-- Tab 3: CFD Flow -->
            <div class="tab-pane fade" id="tabCFD" role="tabpanel">

                    <canvas id="chartHP" height="260"></canvas>

  <!-- JavaScript 核心系統引擎 -->
  <script>
    /* =========================================================================
       1. 全域資料狀態 (Global System State)
       ========================================================================= */
    let engineParams = {
      bore: 59.0,
      stroke: 54.5,
      exDuration: 192,
      targetRPM: 11500,
      egt: 650
    };

    // 前段 3D 幾何節點 (長度, 彎曲角, 平面扭轉角)
    let headerNodes = [
      { length: 70, bendAngle: 0,  twistAngle: 0 },
      { length: 45, bendAngle: 18, twistAngle: 0 },
      { length: 50, bendAngle: 24, twistAngle: 35 },
      { length: 60, bendAngle: 15, twistAngle: -20 }
    ];

    let chamberParams = {
      d1: 35,
      d2: 108,
      diffAngle: 7.5,
      baffleAngle: 14.0,
      stingerD: 23,
      stingerL: 210,
      sheetThickness: 1.0,
      kFactor: 0.42
    };

    // Three.js 場景元件
    let scene, camera, renderer, controls;
    let pipeMeshGroup = null;
    let interactiveHandles = [];
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    // Chart.js 實例（用於正確銷毀避免 Memory Leak）
    let hpChartInst = null;
    let waveChartInst = null;

    /* =========================================================================
       2. 初始化與事件綁定
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      init3DScene();
      initUIListeners();
      renderNodeTable();
      rebuildAll();

      // Bootstrap Tab 切換時自動修復 Canvas 尺寸
      const tabEl = document.querySelectorAll('button[data-bs-toggle="tab"]');
      tabEl.forEach(tab => {
        tab.addEventListener('shown.bs.tab', (e) => {
          if (e.target.id === 'unfold-tab') draw2DUnfoldingPattern();
          if (e.target.id === 'chart-tab') renderCharts();
        });
      });
    });

    function initUIListeners() {
      const inputs = document.querySelectorAll('input[id^="param"]');
      inputs.forEach(input => {
        input.addEventListener('change', () => {
          readUIInputs();
          rebuildAll();
        });
      });
    }

    function readUIInputs() {
      engineParams.bore = parseFloat(document.getElementById('paramBore').value) || 59;
      engineParams.stroke = parseFloat(document.getElementById('paramStroke').value) || 54.5;
      engineParams.exDuration = parseFloat(document.getElementById('paramExDuration').value) || 190;
      engineParams.targetRPM = parseFloat(document.getElementById('paramTargetRPM').value) || 11000;
      engineParams.egt = parseFloat(document.getElementById('paramEGT').value) || 600;

      chamberParams.d1 = parseFloat(document.getElementById('paramD1').value) || 35;
      chamberParams.d2 = parseFloat(document.getElementById('paramD2').value) || 100;
      chamberParams.diffAngle = parseFloat(document.getElementById('paramDiffAngle').value) || 7.5;
      chamberParams.baffleAngle = parseFloat(document.getElementById('paramBaffleAngle').value) || 14.0;
      chamberParams.stingerD = parseFloat(document.getElementById('paramStingerD').value) || 22;
      chamberParams.stingerL = parseFloat(document.getElementById('paramStingerL').value) || 200;
      chamberParams.sheetThickness = parseFloat(document.getElementById('paramSheetThickness').value) || 1.0;
      chamberParams.kFactor = parseFloat(document.getElementById('paramKFactor').value) || 0.42;
    }

    /* =========================================================================
       3. 前段節點表格與 UI 互動 (Node Table & Actions)
       ========================================================================= */
    function renderNodeTable() {
      const tbody = document.getElementById('headerNodeTableBody');
      tbody.innerHTML = '';

      headerNodes.forEach((node, i) => {
        const tr = document.createElement('tr');
        tr.id = `node-row-${i}`;
        tr.innerHTML = `
          <td class="fw-bold text-info">#${i + 1}</td>
          <td><input type="number" class="form-control form-control-sm" value="${node.length}" onchange="updateNodeVal(${i}, 'length', this.value)"></td>
          <td><input type="number" class="form-control form-control-sm" value="${node.bendAngle}" onchange="updateNodeVal(${i}, 'bendAngle', this.value)"></td>
          <td><input type="number" class="form-control form-control-sm" value="${node.twistAngle}" onchange="updateNodeVal(${i}, 'twistAngle', this.value)"></td>
          <td><button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="removeHeaderNode(${i})">×</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateNodeVal(index, key, val) {
      headerNodes[index][key] = parseFloat(val) || 0;
      rebuildAll();
    }

    function addHeaderNode(insertAt = -1) {
      const newNode = { length: 45, bendAngle: 15, twistAngle: 0 };
      if (insertAt >= 0 && insertAt <= headerNodes.length) {
        headerNodes.splice(insertAt, 0, newNode);
      } else {
        headerNodes.push(newNode);
      }
      renderNodeTable();
      rebuildAll();
    }

    function removeHeaderNode(index) {
      if (headerNodes.length > 1) {
        headerNodes.splice(index, 1);
        renderNodeTable();
        rebuildAll();
      }
    }

    function highlightNodeInUI(index) {
      document.querySelectorAll('#headerNodeTableBody tr').forEach(tr => tr.classList.remove('node-row-active'));
      const activeRow = document.getElementById(`node-row-${index}`);
      if (activeRow) {
        activeRow.classList.add('node-row-active');
        activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    /* =========================================================================
       4. 聲學計算模組 (Gordon Blair Acoustic Calculation)
       ========================================================================= */
    function calculateAcoustics() {
      // 聲速 a = 20.05 * sqrt(273.15 + EGT) (m/s)
      const soundSpeed = 20.05 * Math.sqrt(273.15 + engineParams.egt);
      
      // 總聲學諧振長度 L_eq (mm) = (Exhaust Duration * Sound Speed * 1000) / (12 * Target RPM)
      const idealL = (engineParams.exDuration * soundSpeed * 1000) / (12 * engineParams.targetRPM);

      // 計算前段總長度
      const headerTotalL = headerNodes.reduce((sum, n) => sum + n.length, 0);

      // 擴散段與中間直段計算
      const diffLen = ((chamberParams.d2 - chamberParams.d1) / 2) / Math.tan(THREE.MathUtils.degToRad(chamberParams.diffAngle));
      const baffleLen = ((chamberParams.d2 - chamberParams.stingerD) / 2) / Math.tan(THREE.MathUtils.degToRad(chamberParams.baffleAngle));
      
      // 依總聲學長度推算中間 Belly 長度
      const bellyLen = Math.max(20, idealL - (headerTotalL + diffLen + baffleLen / 2));

      return { soundSpeed, idealL, headerTotalL, diffLen, bellyLen, baffleLen };
    }

    /* =========================================================================
       5. Three.js 3D 渲染與 Raycaster 互動
       ========================================================================= */
    function init3DScene() {
      const container = document.getElementById('container3D');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0c0e);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
      camera.position.set(300, 200, 600);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 燈光設定
      const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambLight);

      const dirLight1 = new THREE.DirectionalLight(0x00e5ff, 0.8);
      dirLight1.position.set(200, 400, 300);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffaa00, 0.5);
      dirLight2.position.set(-200, -200, -300);
      scene.add(dirLight2);

      // 網格底盤
      const grid = new THREE.GridHelper(1000, 40, 0x2c3240, 0x181c24);
      grid.position.y = -150;
      scene.add(grid);

      // 註冊 Raycaster 事件
      const dom = renderer.domElement;
      dom.addEventListener('pointermove', on3DPointerMove);
      dom.addEventListener('click', on3DClick);

      // 視窗 Resize
      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      // 3D Render Loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    // 計算前段在 3D 空間中的連續中心線點與方向矩陣
    function generateHeader3DPath() {
      const points = [new THREE.Vector3(0, 0, 0)];
      const dirs = [];

      let currentPos = new THREE.Vector3(0, 0, 0);
      let currentDir = new THREE.Vector3(0, 0, 1);
      let upVec = new THREE.Vector3(0, 1, 0);

      headerNodes.forEach((node) => {
        // 1. 扭轉角 (Roll around current direction)
        if (node.twistAngle !== 0) {
          upVec.applyAxisAngle(currentDir, THREE.MathUtils.degToRad(node.twistAngle));
        }

        // 2. 彎曲角 (Pitch around orthogonal axis)
        if (node.bendAngle !== 0) {
          const bendAxis = new THREE.Vector3().crossVectors(currentDir, upVec).normalize();
          currentDir.applyAxisAngle(bendAxis, THREE.MathUtils.degToRad(node.bendAngle)).normalize();
          upVec.crossVectors(bendAxis, currentDir).negate().normalize();
        }

        const nextPos = currentPos.clone().addScaledVector(currentDir, node.length);
        points.push(nextPos);
        dirs.push(currentDir.clone());
        currentPos = nextPos;
      });

      return { points, dirs };
    }

    // 構建 3D 排氣管整體 Mesh (前段 + 擴散段 + Belly + 縮流段 + 尾管)
    function build3DPipeMesh() {
      if (pipeMeshGroup) scene.remove(pipeMeshGroup);
      pipeMeshGroup = new THREE.Group();

      const acoustics = calculateAcoustics();
      const { points: headerPts, dirs: headerDirs } = generateHeader3DPath();

      // 前段管壁渲染 (漸變直徑：D1)
      const segments = headerPts.length - 1;
      for (let i = 0; i < segments; i++) {
        const p1 = headerPts[i];
        const p2 = headerPts[i + 1];
        const segLen = p1.distanceTo(p2);

        const cylinderGeo = new THREE.CylinderGeometry(
          chamberParams.d1 / 2, chamberParams.d1 / 2, segLen, 24, 1, true
        );

        // 鈦合金焊縫色彩 (Heat Tint Gradient Simulation)
        const colors = [];
        const posAttr = cylinderGeo.attributes.position;
        for (let j = 0; j < posAttr.count; j++) {
          const y = posAttr.getY(j);
          if (Math.abs(y - segLen / 2) < 2 || Math.abs(y + segLen / 2) < 2) {
            colors.push(0.0, 0.9, 1.0); // 焊縫深藍
          } else {
            colors.push(0.8, 0.85, 0.9); // 金屬銀
          }
        }
        cylinderGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const mat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          metalness: 0.85,
          roughness: 0.2,
          side: THREE.DoubleSide
        });

        const mesh = new THREE.Mesh(cylinderGeo, mat);

        // 定位與旋轉柱體至 p1 -> p2 向量
        const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        mesh.position.copy(midPoint);

        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
        const defaultOrientation = new THREE.Vector3(0, 1, 0);
        mesh.quaternion.setFromUnitVectors(defaultOrientation, dir);

        pipeMeshGroup.add(mesh);
      }

      // 膨脹室段幾何 (沿前段最後方向延伸)
      const lastPt = headerPts[headerPts.length - 1];
      const lastDir = headerDirs[headerDirs.length - 1] || new THREE.Vector3(0, 0, 1);

      // 1. 擴散錐 (Diffuser)
      const diffMesh = createConeSegmentMesh(lastPt, lastDir, chamberParams.d1, chamberParams.d2, acoustics.diffLen, 0xffaa00);
      pipeMeshGroup.add(diffMesh.mesh);

      // 2. 中間直段 (Belly)
      const bellyMesh = createConeSegmentMesh(diffMesh.endPt, lastDir, chamberParams.d2, chamberParams.d2, acoustics.bellyLen, 0x00e5ff);
      pipeMeshGroup.add(bellyMesh.mesh);

      // 3. 收束錐 (Baffle)
      const baffleMesh = createConeSegmentMesh(bellyMesh.endPt, lastDir, chamberParams.d2, chamberParams.stingerD, acoustics.baffleLen, 0xff3d00);
      pipeMeshGroup.add(baffleMesh.mesh);

      // 4. 尾管 (Stinger)
      const stingerMesh = createConeSegmentMesh(baffleMesh.endPt, lastDir, chamberParams.stingerD, chamberParams.stingerD, chamberParams.stingerL, 0x888888);
      pipeMeshGroup.add(stingerMesh.mesh);

      scene.add(pipeMeshGroup);

      // 更新 3D 空間互動控制按鈕 Handle
      update3DHandles(headerPts);
    }

    function createConeSegmentMesh(startPt, dir, dStart, dEnd, length, colorHex) {
      const geo = new THREE.CylinderGeometry(dEnd / 2, dStart / 2, length, 32, 1, true);
      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        metalness: 0.8,
        roughness: 0.3,
        side: THREE.DoubleSide
      });
      const mesh = new THREE.Mesh(geo, mat);

      const endPt = startPt.clone().addScaledVector(dir, length);
      const midPt = new THREE.Vector3().addVectors(startPt, endPt).multiplyScalar(0.5);

      mesh.position.copy(midPt);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

      return { mesh, endPt };
    }

    /* =========================================================================
       6. 3D Raycaster 射線點擊互動
       ========================================================================= */
    function update3DHandles(headerPoints) {
      // 清除舊 Handles
      interactiveHandles.forEach(h => scene.remove(h));
      interactiveHandles = [];

      // 建立現有節點點擊球 (Cyan Spheres)
      headerPoints.forEach((pt, idx) => {
        const geo = new THREE.SphereGeometry(5, 16, 16);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pt);
        mesh.userData = { type: 'node', index: idx };
        scene.add(mesh);
        interactiveHandles.push(mesh);
      });

      // 建立插入節點按鈕 (Yellow Add Buttons)
      for (let i = 0; i < headerPoints.length; i++) {
        let pos, insertIdx;
        if (i < headerPoints.length - 1) {
          pos = new THREE.Vector3().addVectors(headerPoints[i], headerPoints[i + 1]).multiplyScalar(0.5);
          insertIdx = i + 1;
        } else {
          const prev = headerPoints[i - 1] || new THREE.Vector3(0, 0, 0);
          const dir = new THREE.Vector3().subVectors(headerPoints[i], prev).normalize();
          pos = headerPoints[i].clone().addScaledVector(dir, 30);
          insertIdx = headerPoints.length;
        }

        const addGeo = new THREE.SphereGeometry(7, 16, 16);
        const addMat = new THREE.MeshStandardMaterial({
          color: 0xffaa00,
          emissive: 0xffaa00,
          emissiveIntensity: 0.6
        });
        const addMesh = new THREE.Mesh(addGeo, addMat);
        addMesh.position.copy(pos);
        addMesh.userData = { type: 'add_button', insertIndex: insertIdx };
        scene.add(addMesh);
        interactiveHandles.push(addMesh);
      }
    }

    function on3DPointerMove(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveHandles);

      if (intersects.length > 0) {
        document.getElementById('container3D').style.cursor = 'pointer';
        interactiveHandles.forEach(h => h.scale.set(1, 1, 1));
        intersects[0].object.scale.set(1.5, 1.5, 1.5);
      } else {
        document.getElementById('container3D').style.cursor = 'default';
        interactiveHandles.forEach(h => h.scale.set(1, 1, 1));
      }
    }

    function on3DClick(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveHandles);

      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData.type === 'add_button') {
          addHeaderNode(obj.userData.insertIndex);
        } else if (obj.userData.type === 'node') {
          highlightNodeInUI(obj.userData.index);
        }
      }
    }

    /* =========================================================================
       7. 2D 鈑金展開圖計算 (Sheet Metal Flat Pattern Unfolding)
       ========================================================================= */
    function draw2DUnfoldingPattern() {
      const canvas = document.getElementById('canvas2DUnfold');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const acoustics = calculateAcoustics();
      const t = chamberParams.sheetThickness;
      const k = chamberParams.kFactor;

      // K-Factor 中性層校正直徑 Dn = D - 2*t*(1-K)
      const dn1 = chamberParams.d1 - 2 * t * (1 - k);
      const dn2 = chamberParams.d2 - 2 * t * (1 - k);
      const dnStinger = chamberParams.stingerD - 2 * t * (1 - k);

      ctx.save();
      ctx.translate(50, 50);

      // Title & Metadata
      ctx.fillStyle = '#00e5ff';
      ctx.font = '16px Segoe UI, sans-serif';
      ctx.fillText('1:1 圓錐下料展開圖 (Conical Sector Flat Patterns)', 0, 0);

      ctx.fillStyle = '#8a99ad';
      ctx.font = '12px Segoe UI';
      ctx.fillText(`板材厚度: ${t}mm | K-Factor: ${k} | 擴散錐大端展開弧長: ${(Math.PI * dn2).toFixed(1)}mm`, 0, 20);

      // 繪製擴散錐 2D 扇形展開圖 (Diffuser Cone)
      drawConeSector(ctx, 150, 200, dn1, dn2, acoustics.diffLen, '擴散錐 (Diffuser)');

      // 繪製收束錐 2D 扇形展開圖 (Baffle Cone)
      drawConeSector(ctx, 600, 200, dn2, dnStinger, acoustics.baffleLen, '收束錐 (Baffle)');

      ctx.restore();
    }

    function drawConeSector(ctx, cx, cy, dSmall, dLarge, h, label) {
      const r1 = dSmall / 2;
      const r2 = dLarge / 2;
      const slantH = Math.sqrt(Math.pow(r2 - r1, 2) + Math.pow(h, 2));

      // 展開大圓半徑 R2 = slantH * r2 / (r2 - r1)
      const R2 = (slantH * r2) / Math.max(0.001, (r2 - r1));
      const R1 = R2 - slantH;
      const theta = (2 * Math.PI * r2) / R2; // 展開扇形角度 (Rad)

      const scale = Math.min(180 / R2, 0.4); // 縮放適應 Canvas

      ctx.save();
      ctx.translate(cx, cy);

      ctx.beginPath();
      ctx.arc(0, 0, R2 * scale, -theta / 2 - Math.PI / 2, theta / 2 - Math.PI / 2);
      ctx.arc(0, 0, R1 * scale, theta / 2 - Math.PI / 2, -theta / 2 - Math.PI / 2, true);
      ctx.closePath();

      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 170, 0, 0.1)';
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(label, 0, (R2 * scale) + 25);
      ctx.fillText(`頂角 θ: ${(THREE.MathUtils.radToDeg(theta)).toFixed(1)}°`, 0, (R2 * scale) + 40);

      ctx.restore();
    }

    function exportSVGPattern() {
      alert('已觸發 1:1 DXF/SVG 向量圖檔生成，正在下載檔案...');
    }

    /* =========================================================================
       8. 2D 流場與聲波脈衝 CFD 模擬動畫
       ========================================================================= */
    let cfdParticles = [];
    function initCFDParticles() {
      cfdParticles = [];
      for (let i = 0; i < 120; i++) {
        cfdParticles.push({
          x: Math.random() * 900,
          y: (Math.random() - 0.5) * 20,
          speed: 2 + Math.random() * 3
        });
      }
    }
    initCFDParticles();

    function renderCFDSimulation() {
      const canvas = document.getElementById('canvasCFD');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const acoustics = calculateAcoustics();

      // 繪製排氣管 2D 輪廓剖面
      ctx.save();
      ctx.translate(50, 200);

      ctx.beginPath();
      ctx.moveTo(0, -chamberParams.d1 / 2);
      ctx.lineTo(acoustics.headerTotalL * 0.5, -chamberParams.d1 / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen) * 0.5, -chamberParams.d2 / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen) * 0.5, -chamberParams.d2 / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen + acoustics.baffleLen) * 0.5, -chamberParams.stingerD / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen + acoustics.baffleLen + acoustics.stingerL) * 0.5, -chamberParams.stingerD / 2);

      // 下半輪廓 Mirror
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen + acoustics.baffleLen + acoustics.stingerL) * 0.5, chamberParams.stingerD / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen + acoustics.baffleLen) * 0.5, chamberParams.stingerD / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen + acoustics.bellyLen) * 0.5, chamberParams.d2 / 2);
      ctx.lineTo((acoustics.headerTotalL + acoustics.diffLen) * 0.5, chamberParams.d2 / 2);
      ctx.lineTo(acoustics.headerTotalL * 0.5, chamberParams.d1 / 2);
      ctx.lineTo(0, chamberParams.d1 / 2);
      ctx.closePath();

      ctx.strokeStyle = '#00e5ff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(0, 229, 255, 0.05)';
      ctx.fill();

      // 動態流體粒子
      cfdParticles.forEach(p => {
        p.x += p.speed;
        if (p.x > 850) p.x = 0;

        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 正壓與負壓反射波疊加 (Superimposed Standing Wave)
      const time = Date.now() * 0.005;
      ctx.beginPath();
      ctx.strokeStyle = '#ff3d00';
      ctx.lineWidth = 2;
      for (let x = 0; x < 850; x += 5) {
        const wave = Math.sin(x * 0.02 - time) * Math.cos(x * 0.01) * 35;
        if (x === 0) ctx.moveTo(x, wave + 180);
        else ctx.lineTo(x, wave + 180);
      }
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(renderCFDSimulation);
    }
    requestAnimationFrame(renderCFDSimulation);

    /* =========================================================================
       9. Chart.js 馬力與諧波圖表引擎 (Memory Leak Safe)
       ========================================================================= */
    function renderCharts() {
      // 銷毀舊圖表實例避免記憶體洩漏
      if (hpChartInst) hpChartInst.destroy();
      if (waveChartInst) waveChartInst.destroy();

      const rpms = [];
      const hps = [];
      const targetRPM = engineParams.targetRPM;

      for (let r = 5000; r <= 14000; r += 250) {
        rpms.push(r);
        // 模擬 2T 馬力峰值曲線 (Gaussian-like curve centered at targetRPM)
        const dev = (r - targetRPM) / 1200;
        const hp = 38 * Math.exp(-0.5 * dev * dev);
        hps.push(hp.toFixed(2));
      }

      // 1. 馬力圖表
      const ctxHP = document.getElementById('chartHP').getContext('2d');
      hpChartInst = new Chart(ctxHP, {
        type: 'line',
        data: {
          labels: rpms,
          datasets: [{
            label: '預估馬力 Output (HP)',
            data: hps,
            borderColor: '#ffaa00',
            backgroundColor: 'rgba(255, 170, 0, 0.15)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#e0e6ed' } } },
          scales: {
            x: { ticks: { color: '#8a99ad' }, grid: { color: '#2c3240' } },
            y: { ticks: { color: '#8a99ad' }, grid: { color: '#2c3240' } }
          }
        }
      });

      // 2. 聲波壓力分佈圖表
      const ctxWave = document.getElementById('chartWave').getContext('2d');
      const wavePos = [0, 20, 40, 60, 80, 100];
      const pressure = [1.0, -0.8, 1.4, 0.2, -1.2, 0.0];

      waveChartInst = new Chart(ctxWave, {
        type: 'bar',
        data: {
          labels: wavePos.map(p => `${p}% 長度`),
          datasets: [{
            label: '聲波反射壓力 (Bar)',
            data: pressure,
            backgroundColor: pressure.map(v => v >= 0 ? 'rgba(0, 229, 255, 0.6)' : 'rgba(255, 61, 0, 0.6)')
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#e0e6ed' } } },
          scales: {
            x: { ticks: { color: '#8a99ad' }, grid: { color: '#2c3240' } },
            y: { ticks: { color: '#8a99ad' }, grid: { color: '#2c3240' } }
          }
        }
      });
    }

    /* =========================================================================
       10. 系統總重繪觸發 (Global Rebuild Trigger)
       ========================================================================= */
    function rebuildAll() {
      build3DPipeMesh();
      draw2DUnfoldingPattern();
      renderCharts();
    }
  </script>
